[project]
name = "api"
description = "Backend (FastAPI + SQLAlchemy + Alembic) for a local-first personal finance app — ledger, accounts, savings/metals/crypto assets, bank reconciliation."
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pyjwt",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
